[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecosystem-mcp"
version = "0.1.0"
description = "MCP server that gives AI agents full context about your multi-project ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Thomas", email = "thomas@peck.to" },
]
keywords = ["mcp", "ai", "devtools", "ecosystem", "claude", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/peckto/ecosystem-mcp"
Issues = "https://github.com/peckto/ecosystem-mcp/issues"

[project.scripts]
ecosystem-mcp = "ecosystem_mcp.server:mcp.run"
